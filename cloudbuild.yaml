steps:
  # 1. Build image dengan nama baru: notes-be-nia
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/notes-be-nia", "."]

  # 2. Push image ke Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/notes-be-nia"]

  # 3. Deploy ke Cloud Run dengan nama service: notes-be-nia
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "notes-be-nia",         # Nama Service di Cloud Run
        "--image",
        "gcr.io/$PROJECT_ID/notes-be-nia", # Menggunakan image yang baru dibuat
        "--timeout",
        "1000s",
        "--port",
        "3000",                 # Tetap di port 3000 sesuai settingan terakhirmu
        "--region",
        "us-central1",
        "--allow-unauthenticated",
      ]

options:
  logging: CLOUD_LOGGING_ONLY